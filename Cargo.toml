[workspace]
members = [
    "crates/logler-core",
    "crates/logler-py",
]
resolver = "2"

[workspace.package]
version = "2.0.0"
edition = "2021"
rust-version = "1.89"
authors = ["Logler Contributors"]
license = "MIT"

[workspace.dependencies]
# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# Regex and pattern matching
regex = "1.11"

# Parallel processing
rayon = "1.8"

# Python bindings
pyo3 = { version = "0.30", features = ["abi3-py312", "anyhow", "chrono"] }

# Utilities
uuid = { version = "1.11", features = ["v4", "serde"] }

# Testing
tempfile = "3.8"

[workspace.lints.clippy]
all = "warn"

[workspace.lints.rust]
unsafe_code = "forbid"
