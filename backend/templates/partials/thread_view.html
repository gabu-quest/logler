<div class="bg-gray-800 p-4 rounded">
    <h3 class="text-lg font-semibold mb-3">Thread: {{ thread.thread_id }}</h3>
    <div class="space-y-2 text-sm">
        <div class="flex justify-between">
            <span class="text-gray-400">Log Count:</span>
            <span>{{ thread.log_count }}</span>
        </div>
        <div class="flex justify-between">
            <span class="text-gray-400">Error Count:</span>
            <span class="text-red-400">{{ thread.error_count }}</span>
        </div>
        <div class="flex justify-between">
            <span class="text-gray-400">First Seen:</span>
            <span>{{ thread.first_seen }}</span>
        </div>
        <div class="flex justify-between">
            <span class="text-gray-400">Last Seen:</span>
            <span>{{ thread.last_seen }}</span>
        </div>
    </div>
</div>
