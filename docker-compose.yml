version: '3.8'

services:
  logler-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "3000:3000"
    environment:
      - RUST_LOG=info
    volumes:
      - /var/log:/var/log:ro
      - ./logs:/app/logs:ro
    restart: unless-stopped

  logler-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8000:8000"
    environment:
      - RUST_BACKEND_URL=http://logler-backend:3000
    depends_on:
      - logler-backend
    restart: unless-stopped
